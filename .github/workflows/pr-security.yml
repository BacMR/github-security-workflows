name: PR Security
on: [pull_request]
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  security:
    # Local `./` reference, not `@main`: this repo must gate its own PRs with the
    # version of security-scan.yml *in the PR*, otherwise a change to that file can
    # only be validated after it is already merged. Consumer repos keep using
    # `@main` (see examples/pr-security.yml). The rendered required-check name is
    # unchanged either way: `security / Security Gate`.
    uses: ./.github/workflows/security-scan.yml
    with:
      scan_mode: pr
      enforce_new_findings: true
      # Rollout step 2 of issue #14: this repo is the first adopter of fail_closed.
      fail_closed: 
      simulate_crash: gitleaks false

  # Aggregate check for the org ruleset: every repo requires a check named exactly
  # `gate`. Every PR-triggered job of this repo must be listed in `needs`, and each
  # must have succeeded. `if: always()` makes the gate report even when a needed job
  # fails or is cancelled, instead of leaving the check missing. Add new PR jobs to
  # `needs` here. dependabot-auto-merge.yml is a separate workflow whose job is skipped
  # for human PRs, so it cannot be a `needs` here and is not covered by this gate.
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    needs:
      - security
    permissions:
      contents: read
    steps:
      - name: Require every PR job to succeed
        env:
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          if [ "$SECURITY_RESULT" != "success" ]; then
            echo "::error::job 'security' finished with result '$SECURITY_RESULT' (expected 'success')"
            exit 1
          fi
          echo "job 'security': success"

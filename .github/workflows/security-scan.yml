name: Security Scan

# Reusable workflow for per-repo scanning. Call it from a repo's own
# workflow (see examples/pr-security.yml).
#
# WHERE THIS RUNS  (changed 2026-10-16 — back to GitHub-hosted; see history below)
#
#   The scan job runs on GitHub-hosted `ubuntu-24.04`; the gate job on `ubuntu-slim`.
#
#   WHY IT MOVED BACK. On 2026-10-06 all four jobs were moved to
#   `[self-hosted, bacmr-ci-vps]`, the containerised ephemeral runner at
#   /opt/bacmr-ci-runner on the VPS. That move existed for exactly one reason: cost.
#   October 2026 burned 3,494 hosted minutes against a 3,000-minute allowance with
#   spending caps at $0, so Actions *stopped* rather than billed. Because the org
#   ruleset requires `security / Security Gate` on dev and main in every repo, a gate
#   that cannot run blocks every PR in the org — so the gate was moved to a runner the
#   billing switch could not reach.
#
#   The org is now on GitHub Enterprise. The minutes constraint that justified the move
#   is gone, and with it the only argument for self-hosting this workflow.
#
#   What the arrangement cost in the meantime — two org-wide outages, both of which
#   presented at the merge gate as ordinary check failures:
#     1. ~29 hours. The runner's `ACCESS_TOKEN` was empty, so the container held only a
#        one-hour registration token. `EPHEMERAL` re-registers after every job, so the
#        first job past the hour 404'd, and `restart: unless-stopped` replayed the dead
#        token 1,756 times.
#     2. Multi-day. The runner deregistered entirely while eight repos still targeted
#        its label. Jobs with no matching runner queue indefinitely and are eventually
#        cancelled — and a `cancelled` required check is indistinguishable from a
#        failing one when you are deciding whether to merge.
#   Nothing alerted on either. One non-redundant runner gated 11 repos.
#
#   The pre-2026-10-06 security rationale also returns intact, and it is worth restating
#   because it is the stronger reason to stay here: on GitHub-hosted runners, untrusted
#   PR code never executes on the VPS. These three scanners do not run the scanned
#   repo's code (Gitleaks reads git history, Trivy reads the filesystem and lockfiles,
#   Semgrep parses source), so self-hosting them was defensible — but "defensible" is a
#   worse place to be than "not a question at all", for a workflow that runs against
#   every PR in every repo including dependency bumps.
#
#   The self-hosted stack is documented at https://vps-setup.bacmr.com (self-hosted
#   runner page) so it can be revived if the org ever returns to a minutes-constrained
#   plan. The open question for that day is redundancy. `bacmr-vps-deploy` and
#   `vps-secscan` are unaffected and stay self-hosted: they run our own code, not
#   third-party dependency trees, and the deploy runner keeps `VPS_SSH_KEY` off hosted
#   runners.
#
#   COST NOTE (2026-11-19): the three scanners used to run as three jobs (~80 s of real
#   scanning) and billed ~4.3 minutes per run, because GitHub rounds every job up to a
#   whole minute. They now run as steps of ONE `scan` job, and the `security-gate` job,
#   which only reads that job's outputs, runs on the 1-vCPU `ubuntu-slim` runner.
#
# FAIL-CLOSED DESIGN (one scan job, one gate job)
#
#   Every scanner step keeps going on failure (`continue-on-error`) so all three scanners
#   always report. Per scanner, a "Record <Scanner> Status" step validates the raw tool
#   output and EXITS NON-ZERO unless the scanner ran cleanly; its `outcome` (success /
#   failure / skipped / cancelled) is a job output. The gate passes only when the scan
#   job's result is `success` AND all three outcomes are exactly `success`; a missing
#   output is not `success`, so it is red too.

on:
  workflow_call:
    inputs:
      scan_mode:
        description: "Scan mode: pr or full"
        required: false
        type: string
        default: "pr"

      enforce_new_findings:
        description: "Fail the security gate when new findings are detected"
        required: false
        type: boolean
        default: false

      # DEPRECATED and IGNORED (2026-11-19): the gate is always fail-closed. Still
      # declared so callers that pass it do not break; `false` only emits a warning.
      # History: issue #14 added it default-off, issue #18 flipped it on after 504
      # scanner downloads let PRs merge unscanned.
      fail_closed:
        description: "DEPRECATED, ignored: the security gate is always fail-closed"
        required: false
        type: boolean
        default: true

      # TEST-ONLY. Deliberately breaks one scanner so the fail-closed path can be
      # proven (see README "Proving the gate fails closed"). Consumer repos must never
      # set it. One of: none, gitleaks, trivy, semgrep.
      simulate_crash:
        description: "TEST ONLY: break one scanner on purpose (none|gitleaks|trivy|semgrep)"
        required: false
        type: string
        default: "none"

      # TEST-ONLY, used by security-self-test.yml. Commits a fixture generated at runtime
      # (never pushed) on top of the checkout and scans that one commit:
      #   clean    -> harmless file, gate must be GREEN
      #   gitleaks -> fake, obviously test-only GitHub PAT + AWS key id
      #   semgrep  -> Python file matching p/default rules
      #   trivy    -> requirements.txt pinning known-vulnerable Django/PyYAML
      #   error    -> harmless file, then the gitleaks binary is deleted (exit 127)
      # Refused (scan job fails) outside BacMR/github-security-workflows.
      self_test:
        description: "TEST ONLY: none|clean|gitleaks|semgrep|trivy|error (security-self-test.yml)"
        required: false
        type: string
        default: "none"

env:
  GITLEAKS_VERSION: "8.30.1"
  # sha256 of gitleaks_<version>_linux_x64.tar.gz. Bump together with the version:
  #   gh api repos/gitleaks/gitleaks/releases/tags/v<ver> -q '.assets[] | select(.name|test("linux_x64.tar.gz$")) | .digest'
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  # Pinned Trivy scanner version for every repo's gate + sha256 of
  # trivy_<version>_Linux-64bit.tar.gz (same `gh api .../releases/tags/v<ver>` digest query).
  TRIVY_VERSION: "0.70.0"
  TRIVY_SHA256: "8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9"

jobs:

# ============================================================
# SCAN — Semgrep, Gitleaks, Trivy as steps of one job
# ============================================================

  scan:
    name: Scan (Gitleaks, Semgrep, Trivy)
    # PINNED deliberately, not `ubuntu-latest`. GitHub flips the `ubuntu-latest`
    # alias to Ubuntu 26 on 2026-10-19, which would change the OS, the default
    # Python/Node and the preinstalled tooling underneath a REQUIRED check without
    # anyone choosing it. This org's failure mode is "green until the environment
    # moves", so an unannounced OS swap under the check that gates every merge is a
    # freeze risk with a date on it.
    #
    # The trade: pinning gives up "automatically current" in exchange for "changes
    # only when we choose". For a required check that is the right way round.
    #
    # FOLLOW-UP, left deliberately visible rather than buried: somebody must move
    # this to `ubuntu-26.04` on purpose, test it, and land it as its own change.
    # This is a pin, not a decision to sit on 24.04 forever -- revisit it, do not
    # let it fossilise.
    runs-on: ubuntu-24.04
    # Was 15 per scanner job when they ran in parallel; now they run in sequence.
    timeout-minutes: 25

    permissions:
      contents: read

    # Vulnerability DB mirrors, tried in order (issue #18): AWS ECR Public first, then
    # Google's mirror, then ghcr.io, so one registry having a bad day does not stop the
    # scan. The DB itself is cached by trivy-action (`cache: true`, actions/cache keyed
    # by date with a restore-key fallback to the newest older day).
    env:
      TRIVY_DB_REPOSITORY: "public.ecr.aws/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2"
      TRIVY_JAVA_DB_REPOSITORY: "public.ecr.aws/aquasecurity/trivy-java-db:1,mirror.gcr.io/aquasec/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1"

    # The gate decides from these alone. `*_outcome` is the outcome of each scanner's
    # "Record Status" step, which exits non-zero unless that scanner ran cleanly.
    outputs:
      gitleaks_outcome: ${{ steps.gitleaks_status.outcome }}
      semgrep_outcome: ${{ steps.semgrep_status.outcome }}
      trivy_outcome: ${{ steps.trivy_status.outcome }}
      gitleaks_reason: ${{ steps.gitleaks_status.outputs.reason }}
      semgrep_reason: ${{ steps.semgrep_status.outputs.reason }}
      trivy_reason: ${{ steps.trivy_status.outputs.reason }}
      gitleaks_new: ${{ steps.findings.outputs.gitleaks_new }}
      trivy_new: ${{ steps.findings.outputs.trivy_new }}
      semgrep_new: ${{ steps.findings.outputs.semgrep_new }}
      total_new: ${{ steps.findings.outputs.total_new }}

    steps:

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # For real callers (self_test=none) this only forwards the PR's base/head SHAs.
      # For the self-test it commits a runtime-generated fixture and scans that commit.
      - name: Resolve Scan Range
        id: range
        env:
          SELF_TEST: ${{ inputs.self_test }}
          REPOSITORY: ${{ github.repository }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$SELF_TEST" = "none" ]; then
            { echo "base=${PR_BASE_SHA}"; echo "head=${PR_HEAD_SHA}"; } >> "$GITHUB_OUTPUT"
            echo "Scan range: ${PR_BASE_SHA}..${PR_HEAD_SHA}"
            exit 0
          fi
          if [ "$REPOSITORY" != "BacMR/github-security-workflows" ]; then
            echo "::error::self_test is test-only; it runs only in BacMR/github-security-workflows"
            exit 1
          fi
          case "$SELF_TEST" in
            clean|gitleaks|semgrep|trivy|error) ;;
            *) echo "::error::Unknown self_test '${SELF_TEST}' (expected none|clean|gitleaks|semgrep|trivy|error)"; exit 1 ;;
          esac
          base=$(git rev-parse HEAD)
          dir=.bacmr-self-test
          mkdir -p "$dir"
          echo "BacMR security self-test fixture (${SELF_TEST}), generated at runtime and never pushed." > "$dir/README.txt"
          case "$SELF_TEST" in
            gitleaks)
              # FAKE, random, test-only values in real token formats.
              tok="ghp_SELFTEST$(openssl rand -hex 14)"
              akid="AKIASELFTEST$(openssl rand -hex 4 | tr '0-9a-f' 'ABCDEFGHIJKLMNOP')"
              printf 'GITHUB_TOKEN=%s\nAWS_ACCESS_KEY_ID=%s\n' "$tok" "$akid" > "$dir/fake-credentials.env"
              ;;
            semgrep)
              cat > "$dir/semgrep_fixture.py" <<'PY'
          import subprocess
          from flask import Flask, request
          app = Flask(__name__)
          @app.route("/run")
          def run():
              subprocess.call(request.args.get("cmd"), shell=True)
              return eval(request.args.get("expr"))
          if __name__ == "__main__":
              app.run(debug=True, host="0.0.0.0")
          PY
              ;;
            trivy)
              printf 'Django==2.2.0\nPyYAML==5.3\n' > "$dir/requirements.txt"
              ;;
          esac
          git add "$dir"
          git -c user.name="bacmr-self-test" -c user.email="self-test@invalid" commit -q --no-verify -m "self-test fixture: ${SELF_TEST}"
          head=$(git rev-parse HEAD)
          { echo "base=${base}"; echo "head=${head}"; } >> "$GITHUB_OUTPUT"
          echo "Self-test '${SELF_TEST}': scan range ${base}..${head}"
          git show --stat --format='%h %s' HEAD

      # ======================================================
      # SEMGREP — runs first: --baseline-commit needs a clean
      # tracked tree, before the other scanners write anything.
      # ======================================================

      # PINNED, not "3.x" (found via issue #14's integrity check, 2026-10-29): once
      # "3.x" resolved to Python 3.15, semgrep 1.182 crashed on every run
      # ("semgrep-core exited with -11" / "exited with 1") in knowledge, api-gateway,
      # web-platform and this repo, and the old gate read the crash as zero findings.
      # 3.12 is verified locally with the same semgrep version. Move it on purpose.
      - name: Set up Python
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Semgrep
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          # PINNED: the version verified on Python 3.12 (issue #14). Dependabot does
          # not track pip installs inside workflow `run:` steps, so bump this
          # deliberately and check the gate's integrity step reports semgrep ok.
          python -m pip install semgrep==1.182.1
          semgrep --version

      - name: Simulate Semgrep Crash (test only)
        if: ${{ !cancelled() && inputs.simulate_crash == 'semgrep' }}
        run: |
          echo "::warning::simulate_crash=semgrep: shadowing semgrep with 'exit 2'"
          mkdir -p "$RUNNER_TEMP/simulated-crash"
          printf '#!/bin/sh\necho "simulated semgrep crash" >&2\nexit 2\n' > "$RUNNER_TEMP/simulated-crash/semgrep"
          chmod +x "$RUNNER_TEMP/simulated-crash/semgrep"
          echo "$RUNNER_TEMP/simulated-crash" >> "$GITHUB_PATH"

      # Remove any same-named file that came with the checkout, so a file committed
      # in the target repo can never stand in for the report of a crashed scanner.
      - name: Remove Stale Semgrep Reports
        if: ${{ !cancelled() }}
        run: rm -f semgrep-new-findings.json semgrep-full.json semgrep-status.json

      - name: Run Semgrep - PR Changes
        id: semgrep_pr
        if: ${{ !cancelled() && inputs.scan_mode == 'pr' }}
        continue-on-error: true
        env:
          BASE_SHA: ${{ steps.range.outputs.base }}
        run: |
          set +e

          semgrep scan \
            --config p/default \
            --baseline-commit "${BASE_SHA}" \
            --json \
            --output semgrep-new-findings.json \
            --metrics off
          rc=$?

          echo "Semgrep exit code: ${rc}"
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run Semgrep - Full Repository
        id: semgrep_full
        if: ${{ !cancelled() && inputs.scan_mode == 'full' }}
        continue-on-error: true
        run: |
          set +e

          semgrep scan \
            --config p/default \
            --json \
            --output semgrep-full.json \
            --metrics off
          rc=$?

          echo "Semgrep exit code: ${rc}"
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"
          exit 0

      # Must run BEFORE "Ensure Semgrep Report Exists", which writes an empty stub.
      # ok = semgrep exited 0/1 (1 = findings with --error; >=2 is a semgrep error)
      # and the report is an object with a `results` array. Exits 1 unless ok, so this
      # step's outcome is the scanner verdict the gate reads.
      - name: Record Semgrep Status
        id: semgrep_status
        if: always()
        continue-on-error: true
        env:
          SCAN_MODE: ${{ inputs.scan_mode }}
          RC: ${{ inputs.scan_mode == 'pr' && steps.semgrep_pr.outputs.rc || steps.semgrep_full.outputs.rc }}
        run: |
          set -uo pipefail
          if [ "$SCAN_MODE" = "pr" ]; then REPORT=semgrep-new-findings.json; else REPORT=semgrep-full.json; fi
          VERSION=$( (semgrep --version 2>/dev/null || true) | head -n1)
          STATUS=failed; REASON=""; FINDINGS=null
          if [ -z "$RC" ]; then
            REASON="scan step did not run"
          elif [ "$RC" != "0" ] && [ "$RC" != "1" ]; then
            REASON="semgrep exited ${RC}"
          elif [ ! -s "$REPORT" ]; then
            REASON="semgrep exited ${RC} but wrote no report"
          elif ! FINDINGS=$(jq -e 'if (.results | type) == "array" then (.results | length) else error("no results array") end' "$REPORT" 2>/dev/null); then
            FINDINGS=null; REASON="report has no results array"
          else
            STATUS=ok
          fi
          jq -n --arg status "$STATUS" --arg reason "$REASON" --arg mode "$SCAN_MODE" \
            --arg version "${VERSION:-unknown}" --arg rc "${RC:-}" --argjson findings "$FINDINGS" \
            '{scanner: "semgrep", status: $status, reason: $reason, scan_mode: $mode,
              tool_version: $version, exit_code: $rc, findings: $findings}' > semgrep-status.json
          cat semgrep-status.json
          echo "reason=${REASON}" >> "$GITHUB_OUTPUT"
          [ "$STATUS" = "ok" ] || { echo "::error title=Semgrep did not run cleanly::${REASON}"; exit 1; }

      - name: Ensure Semgrep Report Exists
        if: always()
        env:
          SCAN_MODE: ${{ inputs.scan_mode }}
        run: |
          if [ "$SCAN_MODE" = "pr" ]; then
            [ -f semgrep-new-findings.json ] || echo '{"results":[]}' > semgrep-new-findings.json
          else
            [ -f semgrep-full.json ] || echo '{"results":[]}' > semgrep-full.json
          fi

      - name: Upload Semgrep Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-results
          path: |
            semgrep-new-findings.json
            semgrep-full.json
            semgrep-status.json
          if-no-files-found: ignore
          retention-days: 30

      # ======================================================
      # GITLEAKS
      # ======================================================

      # Issue #18. On 2026-11-08 github.com/<org>/<repo>/releases/download/... returned
      # HTTP 504 for hours while the API asset endpoint (api.github.com/.../releases/
      # assets/<id>, served via release-assets.githubusercontent.com) kept working. So:
      # verified tarball cache -> direct URL -> API asset endpoint, retried with
      # exponential backoff, always checked against the pinned GITLEAKS_SHA256.
      - name: Restore Gitleaks Tarball Cache
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/bacmr-tools/gitleaks
          key: gitleaks-${{ runner.os }}-${{ env.GITLEAKS_VERSION }}-${{ env.GITLEAKS_SHA256 }}

      - name: Install Gitleaks
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          dir="$HOME/.cache/bacmr-tools/gitleaks"; mkdir -p "$dir"
          verify() { echo "${GITLEAKS_SHA256}  $dir/$tarball" | sha256sum -c --status -; }
          # Fallback: the release API asset endpoint (different serving path from
          # /releases/download). Anonymous first: org IP allow lists (aquasecurity has
          # one) reject the caller's GITHUB_TOKEN; the token only helps if anonymous
          # calls hit the 60/h per-IP rate limit.
          api_fetch() {  # owner/repo tag asset-name out-file
            local hdrs url
            for mode in anon token; do
              hdrs=(-H "Accept: application/vnd.github+json")
              [ "$mode" = token ] && hdrs+=(-H "Authorization: Bearer ${GH_TOKEN}")
              url=$(curl -fsSL --retry 2 --retry-all-errors --connect-timeout 20 --max-time 60 "${hdrs[@]}" \
                "https://api.github.com/repos/$1/releases/tags/$2" | jq -r --arg n "$3" '.assets[] | select(.name == $n) | .url') || url=""
              [ -n "$url" ] || continue
              hdrs[1]="Accept: application/octet-stream"
              curl -fsSL --retry 2 --retry-all-errors --connect-timeout 20 --max-time 120 "${hdrs[@]}" -o "$4" "$url" && return 0
            done
            return 1
          }
          if [ -s "$dir/$tarball" ] && verify; then
            echo "Using cached, sha256-verified $tarball"
          else
            for i in 1 2 3 4 5 6; do
              rm -f "$dir/$tarball"
              curl -fsSL --retry 2 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 90 \
                -o "$dir/$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball" \
                && verify && break
              echo "::warning::Gitleaks direct download attempt $i failed; trying the API asset endpoint"
              rm -f "$dir/$tarball"
              api_fetch gitleaks/gitleaks "v${GITLEAKS_VERSION}" "$tarball" "$dir/$tarball" && verify && break
              if [ "$i" = 6 ]; then echo "::error::Gitleaks download failed after $i attempts"; exit 1; fi
              sleep $(( 5 * 2 ** (i - 1) ))
            done
          fi
          tar -xzf "$dir/$tarball" -C "$RUNNER_TEMP" gitleaks
          sudo mv "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      - name: Simulate Gitleaks Crash (test only)
        if: ${{ !cancelled() && inputs.simulate_crash == 'gitleaks' }}
        run: |
          echo "::warning::simulate_crash=gitleaks: replacing the gitleaks binary with 'exit 1'"
          printf '#!/bin/sh\necho "simulated gitleaks crash" >&2\nexit 1\n' | sudo tee /usr/local/bin/gitleaks >/dev/null
          sudo chmod +x /usr/local/bin/gitleaks

      - name: Simulate Missing Scanner Binary (self-test only)
        if: ${{ !cancelled() && inputs.self_test == 'error' }}
        run: |
          echo "::warning::self_test=error: deleting the gitleaks binary"
          sudo rm -f /usr/local/bin/gitleaks

      - name: Remove Stale Gitleaks Reports
        if: ${{ !cancelled() }}
        run: rm -f gitleaks-new-findings.json gitleaks-full-report.json gitleaks-status.json

      - name: Run Gitleaks - PR Changes
        id: gitleaks_pr
        if: ${{ !cancelled() && inputs.scan_mode == 'pr' }}
        continue-on-error: true
        env:
          BASE_SHA: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
        run: |
          set +e

          echo "Scanning PR commit range:"
          echo "${BASE_SHA}..${HEAD_SHA}"

          gitleaks git \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            --verbose \
            --redact \
            --report-format json \
            --report-path gitleaks-new-findings.json
          rc=$?

          echo "Gitleaks exit code: ${rc}"
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"

          # Gitleaks returns 1 when findings are detected.
          # The security-gate job decides whether findings block the PR.
          exit 0

      - name: Run Gitleaks - Full Repository
        id: gitleaks_full
        if: ${{ !cancelled() && inputs.scan_mode == 'full' }}
        continue-on-error: true
        run: |
          set +e

          echo "Running full historical Gitleaks scan..."

          gitleaks git \
            --verbose \
            --redact \
            --report-format json \
            --report-path gitleaks-full-report.json
          rc=$?

          echo "Gitleaks exit code: ${rc}"
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"
          exit 0

      # Must run BEFORE "Ensure Gitleaks Report Exists", which writes an empty stub.
      # ok = scan step ran, exited 0 (clean) or 1 (leaks found), and its report is a
      # JSON array. Gitleaks writes no report on a fatal error, so a crash cannot
      # masquerade as a clean scan here. Exits 1 unless ok (outcome = verdict).
      - name: Record Gitleaks Status
        id: gitleaks_status
        if: always()
        continue-on-error: true
        env:
          SCAN_MODE: ${{ inputs.scan_mode }}
          RC: ${{ inputs.scan_mode == 'pr' && steps.gitleaks_pr.outputs.rc || steps.gitleaks_full.outputs.rc }}
        run: |
          set -uo pipefail
          if [ "$SCAN_MODE" = "pr" ]; then REPORT=gitleaks-new-findings.json; else REPORT=gitleaks-full-report.json; fi
          VERSION=$(gitleaks version 2>/dev/null | head -n1 || true)
          STATUS=failed; REASON=""; FINDINGS=null
          if [ -z "$RC" ]; then
            REASON="scan step did not run"
          elif [ "$RC" != "0" ] && [ "$RC" != "1" ]; then
            REASON="gitleaks exited ${RC}"
          elif [ ! -s "$REPORT" ]; then
            REASON="gitleaks exited ${RC} but wrote no report"
          elif ! FINDINGS=$(jq -e 'if type == "array" then length else error("not an array") end' "$REPORT" 2>/dev/null); then
            FINDINGS=null; REASON="report is not a JSON array"
          else
            STATUS=ok
          fi
          jq -n --arg status "$STATUS" --arg reason "$REASON" --arg mode "$SCAN_MODE" \
            --arg version "${VERSION:-unknown}" --arg rc "${RC:-}" --argjson findings "$FINDINGS" \
            '{scanner: "gitleaks", status: $status, reason: $reason, scan_mode: $mode,
              tool_version: $version, exit_code: $rc, findings: $findings}' > gitleaks-status.json
          cat gitleaks-status.json
          echo "reason=${REASON}" >> "$GITHUB_OUTPUT"
          [ "$STATUS" = "ok" ] || { echo "::error title=Gitleaks did not run cleanly::${REASON}"; exit 1; }

      - name: Ensure Gitleaks Report Exists
        if: always()
        env:
          SCAN_MODE: ${{ inputs.scan_mode }}
        run: |
          if [ "$SCAN_MODE" = "pr" ]; then
            [ -f gitleaks-new-findings.json ] || echo "[]" > gitleaks-new-findings.json
          else
            [ -f gitleaks-full-report.json ] || echo "[]" > gitleaks-full-report.json
          fi

      - name: Upload Gitleaks Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-results
          path: |
            gitleaks-new-findings.json
            gitleaks-full-report.json
            gitleaks-status.json
          if-no-files-found: ignore
          retention-days: 30

      # ======================================================
      # TRIVY — PR mode scans BASE and PR separately; the
      # findings step below compares the results.
      # ======================================================

      - name: Remove Stale Trivy Reports
        if: ${{ !cancelled() }}
        run: rm -f trivy-base.json trivy-pr.json trivy-full.json trivy-status.json

      # Install Trivy ourselves from the GitHub release, checksum-verified, instead of
      # letting trivy-action call setup-trivy. setup-trivy's install.sh fetches the
      # tarball from https://get.trivy.dev (download-tracking redirect), and on
      # 2026-11-03 that hostname started returning NXDOMAIN from its authoritative DNS,
      # so curl exited 6 and no Trivy scan ran org-wide. GitHub release assets are the
      # same files the redirect points at. Bump TRIVY_VERSION + TRIVY_SHA256 (workflow
      # env) deliberately: it is the scanner version for every repo's gate.
      #
      # Issue #18 (2026-11-08): the direct release URL returned HTTP 504 for hours
      # (curl exit 22) while the API asset endpoint kept working. Same chain as
      # Gitleaks: verified tarball cache -> direct URL -> API asset endpoint,
      # exponential backoff, pinned sha256 (no second checksums.txt download).
      - name: Restore Trivy Tarball Cache
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/bacmr-tools/trivy
          key: trivy-${{ runner.os }}-${{ env.TRIVY_VERSION }}-${{ env.TRIVY_SHA256 }}

      - name: Install Trivy
        id: trivy_install
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          dir="$HOME/.cache/bacmr-tools/trivy"; mkdir -p "$dir"
          verify() { echo "${TRIVY_SHA256}  $dir/$tarball" | sha256sum -c --status -; }
          # Fallback: the release API asset endpoint (different serving path from
          # /releases/download). Anonymous first: org IP allow lists (aquasecurity has
          # one) reject the caller's GITHUB_TOKEN; the token only helps if anonymous
          # calls hit the 60/h per-IP rate limit.
          api_fetch() {  # owner/repo tag asset-name out-file
            local hdrs url
            for mode in anon token; do
              hdrs=(-H "Accept: application/vnd.github+json")
              [ "$mode" = token ] && hdrs+=(-H "Authorization: Bearer ${GH_TOKEN}")
              url=$(curl -fsSL --retry 2 --retry-all-errors --connect-timeout 20 --max-time 60 "${hdrs[@]}" \
                "https://api.github.com/repos/$1/releases/tags/$2" | jq -r --arg n "$3" '.assets[] | select(.name == $n) | .url') || url=""
              [ -n "$url" ] || continue
              hdrs[1]="Accept: application/octet-stream"
              curl -fsSL --retry 2 --retry-all-errors --connect-timeout 20 --max-time 120 "${hdrs[@]}" -o "$4" "$url" && return 0
            done
            return 1
          }
          if [ -s "$dir/$tarball" ] && verify; then
            echo "Using cached, sha256-verified $tarball"
          else
            for i in 1 2 3 4 5 6; do
              rm -f "$dir/$tarball"
              curl -fsSL --retry 2 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 120 \
                -o "$dir/$tarball" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$tarball" \
                && verify && break
              echo "::warning::Trivy direct download attempt $i failed; trying the API asset endpoint"
              rm -f "$dir/$tarball"
              api_fetch aquasecurity/trivy "v${TRIVY_VERSION}" "$tarball" "$dir/$tarball" && verify && break
              if [ "$i" = 6 ]; then echo "::error::Trivy download failed after $i attempts"; exit 1; fi
              sleep $(( 5 * 2 ** (i - 1) ))
            done
          fi
          mkdir -p "$HOME/.local/bin/trivy-bin"
          tar -xzf "$dir/$tarball" -C "$HOME/.local/bin/trivy-bin" trivy
          echo "$HOME/.local/bin/trivy-bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/trivy-bin/trivy" --version

      - name: Create Base Worktree
        id: trivy_worktree
        if: ${{ !cancelled() && inputs.scan_mode == 'pr' }}
        continue-on-error: true
        env:
          BASE_SHA: ${{ steps.range.outputs.base }}
        run: |
          set -euo pipefail
          git worktree add --detach ../base-repository "${BASE_SHA}"

      - name: Scan Base Repository
        id: trivy_base
        if: ${{ !cancelled() && inputs.scan_mode == 'pr' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          cache: true
          scan-type: fs
          scan-ref: ../base-repository
          format: json
          output: trivy-base.json
          severity: CRITICAL,HIGH
          scanners: vuln
          vuln-type: os,library
          exit-code: "0"

      - name: Scan PR Repository
        id: trivy_pr
        if: ${{ !cancelled() && inputs.scan_mode == 'pr' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          cache: true
          scan-type: fs
          # simulate_crash=trivy points Trivy at a path that does not exist, so the
          # real binary fails (test only; see the input's comment).
          scan-ref: ${{ inputs.simulate_crash == 'trivy' && './simulated-trivy-crash-does-not-exist' || '.' }}
          format: json
          output: trivy-pr.json
          severity: CRITICAL,HIGH
          scanners: vuln
          vuln-type: os,library
          exit-code: "0"

      - name: Full Trivy Scan
        id: trivy_full
        if: ${{ !cancelled() && inputs.scan_mode == 'full' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          cache: true
          scan-type: fs
          scan-ref: ${{ inputs.simulate_crash == 'trivy' && './simulated-trivy-crash-does-not-exist' || '.' }}
          format: json
          output: trivy-full.json
          severity: CRITICAL,HIGH
          scanners: vuln
          vuln-type: os,library
          exit-code: "0"

      # Must run BEFORE "Ensure Trivy Reports Exist", which writes empty stubs.
      # ok = every scan step for this mode succeeded and each report is a Trivy JSON
      # document (an object carrying SchemaVersion). Exits 1 unless ok (outcome = verdict).
      - name: Record Trivy Status
        id: trivy_status
        if: always()
        continue-on-error: true
        env:
          SCAN_MODE: ${{ inputs.scan_mode }}
          BASE_OUTCOME: ${{ steps.trivy_base.outcome }}
          PR_OUTCOME: ${{ steps.trivy_pr.outcome }}
          FULL_OUTCOME: ${{ steps.trivy_full.outcome }}
        run: |
          set -uo pipefail
          VERSION=$( (trivy --version 2>/dev/null || true) | head -n1)
          STATUS=ok; REASON=""; FINDINGS=null
          if [ "$SCAN_MODE" = "pr" ]; then
            CHECKS="base:${BASE_OUTCOME}:trivy-base.json pr:${PR_OUTCOME}:trivy-pr.json"
            COUNT_FILE=trivy-pr.json
          else
            CHECKS="full:${FULL_OUTCOME}:trivy-full.json"
            COUNT_FILE=trivy-full.json
          fi
          for c in $CHECKS; do
            IFS=: read -r name outcome report <<< "$c"
            if [ "$outcome" != "success" ]; then
              STATUS=failed; REASON="${REASON}${name} scan outcome '${outcome:-not run}'; "
            elif ! jq -e 'type == "object" and has("SchemaVersion")' "$report" >/dev/null 2>&1; then
              STATUS=failed; REASON="${REASON}${name} report missing or not Trivy JSON; "
            fi
          done
          if [ "$STATUS" = "ok" ]; then
            FINDINGS=$(jq '[.Results[]?.Vulnerabilities // []] | flatten | length' "$COUNT_FILE" 2>/dev/null || echo null)
          fi
          jq -n --arg status "$STATUS" --arg reason "$REASON" --arg mode "$SCAN_MODE" \
            --arg version "${VERSION:-unknown}" --argjson findings "$FINDINGS" \
            '{scanner: "trivy", status: $status, reason: $reason, scan_mode: $mode,
              tool_version: $version, findings: $findings}' > trivy-status.json
          cat trivy-status.json
          echo "reason=${REASON}" >> "$GITHUB_OUTPUT"
          [ "$STATUS" = "ok" ] || { echo "::error title=Trivy did not run cleanly::${REASON}"; exit 1; }

      - name: Ensure Trivy Reports Exist
        if: always()
        run: |
          [ -f trivy-base.json ] || echo '{"Results":[]}' > trivy-base.json
          [ -f trivy-pr.json ]   || echo '{"Results":[]}' > trivy-pr.json
          [ -f trivy-full.json ] || echo '{"Results":[]}' > trivy-full.json

      - name: Upload Trivy Reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-results
          path: |
            trivy-base.json
            trivy-pr.json
            trivy-full.json
            trivy-status.json
          if-no-files-found: ignore
          retention-days: 30

      # ======================================================
      # FINDINGS — counted here, where the reports are, so the
      # gate job needs no artifacts and no jq.
      # ======================================================

      - name: Analyze Security Findings
        id: findings
        if: always()
        env:
          SCAN_MODE: ${{ inputs.scan_mode }}
        run: |
          set -euo pipefail

          GITLEAKS_NEW=0
          TRIVY_NEW=0
          SEMGREP_NEW=0

          if [ "$SCAN_MODE" = "pr" ]; then

            if [ -f gitleaks-new-findings.json ]; then
              GITLEAKS_NEW=$(jq 'length' gitleaks-new-findings.json 2>/dev/null || echo 0)
            fi

            # Trivy finding identity:
            # Target + VulnerabilityID + PkgName + InstalledVersion
            for side in base pr; do
              jq -r '
                [
                  .Results[]? |
                  . as $result |
                  ($result.Vulnerabilities // [])[] |
                  [$result.Target, .VulnerabilityID, .PkgName, .InstalledVersion] |
                  @tsv
                ] | unique | .[]
              ' "trivy-${side}.json" 2>/dev/null \
                | sort > "$RUNNER_TEMP/trivy-${side}.txt" || true
            done

            comm -13 "$RUNNER_TEMP/trivy-base.txt" "$RUNNER_TEMP/trivy-pr.txt" > "$RUNNER_TEMP/trivy-new.txt"
            TRIVY_NEW=$(wc -l < "$RUNNER_TEMP/trivy-new.txt" | tr -d ' ')

            if [ -f semgrep-new-findings.json ]; then
              SEMGREP_NEW=$(jq '.results | length' semgrep-new-findings.json 2>/dev/null || echo 0)
            fi

          else

            # Full scans report the entire existing backlog.
            # They do NOT become merge gates.

            if [ -f gitleaks-full-report.json ]; then
              GITLEAKS_NEW=$(jq 'length' gitleaks-full-report.json 2>/dev/null || echo 0)
            fi

            if [ -f trivy-full.json ]; then
              TRIVY_NEW=$(jq '[.Results[]?.Vulnerabilities // []] | flatten | length' trivy-full.json 2>/dev/null || echo 0)
            fi

            if [ -f semgrep-full.json ]; then
              SEMGREP_NEW=$(jq '.results | length' semgrep-full.json 2>/dev/null || echo 0)
            fi

          fi

          TOTAL_NEW=$((GITLEAKS_NEW + TRIVY_NEW + SEMGREP_NEW))

          echo "Gitleaks findings: ${GITLEAKS_NEW}"
          echo "Trivy findings: ${TRIVY_NEW}"
          echo "Semgrep findings: ${SEMGREP_NEW}"
          echo "Total findings: ${TOTAL_NEW}"

          {
            echo "gitleaks_new=${GITLEAKS_NEW}"
            echo "trivy_new=${TRIVY_NEW}"
            echo "semgrep_new=${SEMGREP_NEW}"
            echo "total_new=${TOTAL_NEW}"
          } >> "$GITHUB_OUTPUT"

# ============================================================
# SECURITY GATE
#
# The ONLY job that determines whether the PR security check
# passes or fails. Reads the scan job's outputs; no checkout,
# no artifacts, no scanner tooling.
# ============================================================

  security-gate:
    name: Security Gate
    # Bookkeeping only: 1 vCPU, a fraction of a standard minute. Needs bash and the
    # Node runtime for github-script, nothing else.
    runs-on: ubuntu-slim
    timeout-minutes: 10

    needs:
      - scan

    if: always()

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:

      - name: Validate Inputs
        env:
          SIMULATE_CRASH: ${{ inputs.simulate_crash }}
          SELF_TEST: ${{ inputs.self_test }}
          FAIL_CLOSED: ${{ inputs.fail_closed }}
        run: |
          if [ "$FAIL_CLOSED" != "true" ]; then
            echo "::warning title=fail_closed is deprecated::fail_closed is deprecated and ignored; the security gate is always fail-closed. Remove it from this repo's pr-security.yml."
          fi
          case "$SIMULATE_CRASH" in
            none|gitleaks|trivy|semgrep) echo "simulate_crash=${SIMULATE_CRASH}" ;;
            *) echo "::error::Unknown simulate_crash value '${SIMULATE_CRASH}' (expected none|gitleaks|trivy|semgrep)"; exit 1 ;;
          esac
          case "$SELF_TEST" in
            none|clean|gitleaks|semgrep|trivy|error) echo "self_test=${SELF_TEST}" ;;
            *) echo "::error::Unknown self_test value '${SELF_TEST}' (expected none|clean|gitleaks|semgrep|trivy|error)"; exit 1 ;;
          esac

      # Healthy = scan job result `success` AND each scanner's recorded outcome is
      # exactly `success`. Anything else, including an empty (missing) output, is a
      # problem. This step never fails; "Enforce Scanner Integrity" acts on it.
      - name: Check Scanner Integrity
        id: integrity
        env:
          SCAN_RESULT: ${{ needs.scan.result }}
          GITLEAKS_OUTCOME: ${{ needs.scan.outputs.gitleaks_outcome }}
          SEMGREP_OUTCOME: ${{ needs.scan.outputs.semgrep_outcome }}
          TRIVY_OUTCOME: ${{ needs.scan.outputs.trivy_outcome }}
          GITLEAKS_REASON: ${{ needs.scan.outputs.gitleaks_reason }}
          SEMGREP_REASON: ${{ needs.scan.outputs.semgrep_reason }}
          TRIVY_REASON: ${{ needs.scan.outputs.trivy_reason }}
        run: |
          set -uo pipefail
          PROBLEMS=""
          if [ "$SCAN_RESULT" != "success" ]; then
            echo "::warning title=Scan job did not succeed::scan job result '${SCAN_RESULT:-missing}'"
            PROBLEMS="scan job result '${SCAN_RESULT:-missing}'; "
          fi
          for s in gitleaks semgrep trivy; do
            up="$(echo "$s" | tr '[:lower:]' '[:upper:]')"
            outcome_var="${up}_OUTCOME"; reason_var="${up}_REASON"
            outcome="${!outcome_var}"; reason="${!reason_var}"
            if [ "$outcome" = "success" ]; then
              echo "${s}: success"
            else
              problem="outcome '${outcome:-missing}'${reason:+: ${reason}}"
              echo "::warning title=Scanner ${s} did not run cleanly::${s}: ${problem}. Its findings count is NOT trustworthy."
              PROBLEMS="${PROBLEMS}${s}: ${problem}; "
            fi
          done
          if [ -n "$PROBLEMS" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
          echo "problems=${PROBLEMS}" >> "$GITHUB_OUTPUT"

      - name: Write Security Summary
        env:
          GITLEAKS_NEW: ${{ needs.scan.outputs.gitleaks_new }}
          TRIVY_NEW: ${{ needs.scan.outputs.trivy_new }}
          SEMGREP_NEW: ${{ needs.scan.outputs.semgrep_new }}
          TOTAL_NEW: ${{ needs.scan.outputs.total_new }}
          SCAN_MODE: ${{ inputs.scan_mode }}
          INTEGRITY_OK: ${{ steps.integrity.outputs.ok }}
          INTEGRITY_PROBLEMS: ${{ steps.integrity.outputs.problems }}
        run: |
          {
            echo "# 🛡️ Security Scan Results"
            echo ""

            if [ "$SCAN_MODE" = "pr" ]; then
              echo "## New Findings Introduced by This PR"
            else
              echo "## Full Repository Scan"
            fi

            echo ""
            echo "| Scanner | Findings |"
            echo "|---|---:|"
            echo "| Gitleaks | ${GITLEAKS_NEW} |"
            echo "| Trivy | ${TRIVY_NEW} |"
            echo "| Semgrep | ${SEMGREP_NEW} |"
            echo "| **Total** | **${TOTAL_NEW}** |"
            echo ""

            if [ "$INTEGRITY_OK" != "true" ]; then
              echo "### ⚠️ Scanner integrity: NOT all scanners ran cleanly"
              echo ""
              echo "${INTEGRITY_PROBLEMS}"
              echo ""
              echo "The gate fails: the counts above are not trustworthy."
              echo ""
            fi

            if [ "$SCAN_MODE" = "pr" ]; then
              if [ "$TOTAL_NEW" = "0" ]; then
                echo "### ✅ No New Security Findings"
                echo ""
                echo "Existing findings are not treated as new findings."
              else
                echo "### ⚠️ New Security Findings Detected"
                echo ""
                echo "This PR introduced ${TOTAL_NEW:-an unknown number of} new security finding(s)."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on Pull Request
        if: github.event_name == 'pull_request' && inputs.self_test == 'none'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GITLEAKS_NEW: ${{ needs.scan.outputs.gitleaks_new }}
          TRIVY_NEW: ${{ needs.scan.outputs.trivy_new }}
          SEMGREP_NEW: ${{ needs.scan.outputs.semgrep_new }}
          TOTAL_NEW: ${{ needs.scan.outputs.total_new }}
          ENFORCE: ${{ inputs.enforce_new_findings }}
          INTEGRITY_OK: ${{ steps.integrity.outputs.ok }}
          INTEGRITY_PROBLEMS: ${{ steps.integrity.outputs.problems }}
        with:
          script: |
            const prNumber = context.payload.pull_request?.number;
            if (!prNumber) {
              return;
            }

            const gitleaks = Number(process.env.GITLEAKS_NEW || 0);
            const trivy = Number(process.env.TRIVY_NEW || 0);
            const semgrep = Number(process.env.SEMGREP_NEW || 0);
            const total = Number(process.env.TOTAL_NEW || 0);
            const enforce = process.env.ENFORCE === "true";

            let body = `## 🛡️ Security Scan Results\n\n`;
            body += `This scan evaluates **new findings introduced by this pull request**.\n\n`;
            body += `| Scanner | New Findings |\n`;
            body += `|---|---:|\n`;
            body += `| 🔑 Gitleaks | ${gitleaks} |\n`;
            body += `| 📦 Trivy | ${trivy} |\n`;
            body += `| 🔍 Semgrep | ${semgrep} |\n`;
            body += `| **Total** | **${total}** |\n\n`;

            if (total === 0) {
              body += `### ✅ No New Security Findings\n\n`;
              body += `No new Gitleaks, Trivy, or Semgrep findings were detected.\n\n`;
              body += enforce ? `**Security gate: PASSED**` : `**Security gate: WARN-ONLY**`;
            } else {
              body += `### ⚠️ New Security Findings Detected\n\n`;
              body += `This pull request introduces **${total} new security finding(s)**.\n\n`;
              if (enforce) {
                body += `### ❌ Security Gate: FAILED\n\n`;
                body += `New security findings must be resolved before this pull request can be merged.`;
              } else {
                body += `### ⚠️ Security Gate: WARN-ONLY\n\n`;
                body += `New findings were detected, but this workflow is currently configured not to block merges.`;
              }
            }

            if (process.env.INTEGRITY_OK !== "true") {
              body += `\n\n### ⚠️ Scanner integrity: not all scanners ran cleanly\n\n`;
              body += `${process.env.INTEGRITY_PROBLEMS || "unknown"}\n\n`;
              body += `**Security Gate FAILED: the gate is always fail-closed.**`;
            }

            body += `\n\n🤖 *Security scan results are available in the GitHub Actions run.*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body
            });

      # A scan job that failed, timed out or was cancelled never produced trustworthy
      # outputs. (Before the merge, the gate's
      # artifact download failed in that case, so this is not a behaviour change.)
      - name: Require Scan Job Success
        env:
          SCAN_RESULT: ${{ needs.scan.result }}
        run: |
          if [ "$SCAN_RESULT" != "success" ]; then
            echo "::error::Security gate failed: scan job result '${SCAN_RESULT:-missing}' (expected 'success')"
            exit 1
          fi
          echo "Scan job: success"

      # Always on; the deprecated fail_closed input cannot turn it off.
      - name: Enforce Scanner Integrity
        env:
          INTEGRITY_OK: ${{ steps.integrity.outputs.ok }}
          INTEGRITY_PROBLEMS: ${{ steps.integrity.outputs.problems }}
        run: |
          if [ "$INTEGRITY_OK" != "true" ]; then
            echo "::error::Security gate failed: not all scanners ran cleanly: ${INTEGRITY_PROBLEMS}"
            exit 1
          fi
          echo "All three scanners ran cleanly."

      - name: Enforce Security Gate
        if: inputs.scan_mode == 'pr' && inputs.enforce_new_findings == true
        env:
          TOTAL_NEW: ${{ needs.scan.outputs.total_new }}
        run: |
          case "$TOTAL_NEW" in
            ''|*[!0-9]*) echo "::error::Security gate failed: findings total '${TOTAL_NEW}' is missing or not a number."; exit 1 ;;
          esac
          if [ "$TOTAL_NEW" -gt 0 ]; then
            echo "::error::Security gate failed: ${TOTAL_NEW} new security finding(s) were introduced."
            exit 1
          fi

          echo "Security gate passed."
          echo "No new security findings detected."

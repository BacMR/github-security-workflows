name: Security Scan

# Reusable workflow for per-repo scanning. Call it from a repo's own
# workflow (see examples/pr-security.yml).
#
# WHERE THIS RUNS  (changed 2026-10-16 — back to GitHub-hosted; see history below)
#
#   Every job runs on `ubuntu-latest`.
#
#   WHY IT MOVED BACK. On 2026-10-06 all four jobs were moved to
#   `[self-hosted, bacmr-ci-vps]`, the containerised ephemeral runner at
#   /opt/bacmr-ci-runner on the VPS. That move existed for exactly one reason: cost.
#   October 2026 burned 3,494 hosted minutes against a 3,000-minute allowance with
#   spending caps at $0, so Actions *stopped* rather than billed. Because the org
#   ruleset requires `security / Security Gate` on dev and main in every repo, a gate
#   that cannot run blocks every PR in the org — so the gate was moved to a runner the
#   billing switch could not reach.
#
#   The org is now on GitHub Enterprise. The minutes constraint that justified the move
#   is gone, and with it the only argument for self-hosting this workflow.
#
#   What the arrangement cost in the meantime — two org-wide outages, both of which
#   presented at the merge gate as ordinary check failures:
#     1. ~29 hours. The runner's `ACCESS_TOKEN` was empty, so the container held only a
#        one-hour registration token. `EPHEMERAL` re-registers after every job, so the
#        first job past the hour 404'd, and `restart: unless-stopped` replayed the dead
#        token 1,756 times.
#     2. Multi-day. The runner deregistered entirely while eight repos still targeted
#        its label. Jobs with no matching runner queue indefinitely and are eventually
#        cancelled — and a `cancelled` required check is indistinguishable from a
#        failing one when you are deciding whether to merge.
#   Nothing alerted on either. One non-redundant runner gated 11 repos.
#
#   The pre-2026-10-06 security rationale also returns intact, and it is worth restating
#   because it is the stronger reason to stay here: on GitHub-hosted runners, untrusted
#   PR code never executes on the VPS. These three scanners do not run the scanned
#   repo's code (Gitleaks reads git history, Trivy reads the filesystem and lockfiles,
#   Semgrep parses source), so self-hosting them was defensible — but "defensible" is a
#   worse place to be than "not a question at all", for a workflow that runs against
#   every PR in every repo including dependency bumps.
#
#   The self-hosted stack is documented at https://vps-setup.bacmr.com (self-hosted
#   runner page) so it can be revived if the org ever returns to a minutes-constrained
#   plan. The open question for that day is redundancy. `bacmr-vps-deploy` and
#   `vps-secscan` are unaffected and stay self-hosted: they run our own code, not
#   third-party dependency trees, and the deploy runner keeps `VPS_SSH_KEY` off hosted
#   runners.
#
#   COST NOTE, for whoever revisits this: these four jobs do ~80 seconds of real
#   scanning but bill as ~4.3 minutes per run, because GitHub rounds every job up to a
#   whole minute — 1,180 minutes, 32% of all org Actions minutes in October 2026.
#   Consolidating the three scanners into one job is the obvious optimisation and would
#   cut both the bill and the wall clock. That, not self-hosting, is the right lever.

on:
  workflow_call:
    inputs:
      scan_mode:
        description: "Scan mode: pr or full"
        required: false
        type: string
        default: "pr"

      enforce_new_findings:
        description: "Fail the security gate when new findings are detected"
        required: false
        type: boolean
        default: false

      # Issue #14. When true, the gate FAILS unless all three scanners wrote a
      # parsable `<scanner>-status.json` with `status: ok` and their jobs succeeded.
      # Default false = previous decisions unchanged; the gate only warns about
      # missing/failed scanners. Rollout: enable per repo, then flip this default.
      fail_closed:
        description: "Fail the security gate when any scanner crashed or produced no/unparsable output"
        required: false
        type: boolean
        default: false

      # TEST-ONLY. Deliberately breaks one scanner so the fail_closed path can be
      # proven (see README "Proving the gate fails closed"). Consumer repos must never
      # set it. One of: none, gitleaks, trivy, semgrep.
      simulate_crash:
        description: "TEST ONLY: break one scanner on purpose (none|gitleaks|trivy|semgrep)"
        required: false
        type: string
        default: "none"

env:
  GITLEAKS_VERSION: "8.30.1"

# ============================================================
# GITLEAKS
# ============================================================

jobs:

  gitleaks:
    name: Gitleaks
    # PINNED deliberately, not `ubuntu-latest`. GitHub flips the `ubuntu-latest`
    # alias to Ubuntu 26 on 2026-10-19, which would change the OS, the default
    # Python/Node and the preinstalled tooling underneath a REQUIRED check without
    # anyone choosing it. This org's failure mode is "green until the environment
    # moves", so an unannounced OS swap under the check that gates every merge is a
    # freeze risk with a date on it.
    #
    # The trade: pinning gives up "automatically current" in exchange for "changes
    # only when we choose". For a required check that is the right way round.
    #
    # FOLLOW-UP, left deliberately visible rather than buried: somebody must move
    # this to `ubuntu-26.04` on purpose, test it, and land it as its own change.
    # This is a pin, not a decision to sit on 24.04 forever -- revisit it, do not
    # let it fossilise.
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read

    steps:

      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          set -euo pipefail

          wget -q \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"

          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Simulate Gitleaks Crash (test only)
        if: inputs.simulate_crash == 'gitleaks'
        run: |
          echo "::warning::simulate_crash=gitleaks: replacing the gitleaks binary with 'exit 1'"
          printf '#!/bin/sh\necho "simulated gitleaks crash" >&2\nexit 1\n' | sudo tee /usr/local/bin/gitleaks >/dev/null
          sudo chmod +x /usr/local/bin/gitleaks

      # ======================================================
      # PR SCAN
      # ======================================================

      - name: Run Gitleaks - PR Changes
        id: gitleaks_pr
        if: inputs.scan_mode == 'pr'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e

          echo "Scanning PR commit range:"
          echo "${BASE_SHA}..${HEAD_SHA}"

          gitleaks git \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            --verbose \
            --redact \
            --report-format json \
            --report-path gitleaks-new-findings.json
          rc=$?

          echo "Gitleaks exit code: ${rc}"
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"

          # Gitleaks returns 1 when findings are detected.
          # The security-gate job decides whether findings block the PR.
          exit 0

      # ======================================================
      # FULL SCAN
      # ======================================================

      - name: Run Gitleaks - Full Repository
        id: gitleaks_full
        if: inputs.scan_mode == 'full'
        run: |
          set +e

          echo "Running full historical Gitleaks scan..."

          gitleaks git \
            --verbose \
            --redact \
            --report-format json \
            --report-path gitleaks-full-report.json
          rc=$?

          echo "Gitleaks exit code: ${rc}"
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"
          exit 0

      # Must run BEFORE "Ensure Gitleaks Report Exists", which writes an empty stub.
      # ok = scan step ran, exited 0 (clean) or 1 (leaks found), and its report is a
      # JSON array. Gitleaks writes no report on a fatal error, so a crash cannot
      # masquerade as a clean scan here.
      - name: Record Gitleaks Status
        if: always()
        env:
          SCAN_MODE: ${{ inputs.scan_mode }}
          RC: ${{ inputs.scan_mode == 'pr' && steps.gitleaks_pr.outputs.rc || steps.gitleaks_full.outputs.rc }}
        run: |
          set -uo pipefail
          if [ "$SCAN_MODE" = "pr" ]; then REPORT=gitleaks-new-findings.json; else REPORT=gitleaks-full-report.json; fi
          VERSION=$(gitleaks version 2>/dev/null | head -n1 || true)
          STATUS=failed; REASON=""; FINDINGS=null
          if [ -z "$RC" ]; then
            REASON="scan step did not run"
          elif [ "$RC" != "0" ] && [ "$RC" != "1" ]; then
            REASON="gitleaks exited ${RC}"
          elif [ ! -s "$REPORT" ]; then
            REASON="gitleaks exited ${RC} but wrote no report"
          elif ! FINDINGS=$(jq -e 'if type == "array" then length else error("not an array") end' "$REPORT" 2>/dev/null); then
            FINDINGS=null; REASON="report is not a JSON array"
          else
            STATUS=ok
          fi
          jq -n --arg status "$STATUS" --arg reason "$REASON" --arg mode "$SCAN_MODE" \
            --arg version "${VERSION:-unknown}" --arg rc "${RC:-}" --argjson findings "$FINDINGS" \
            '{scanner: "gitleaks", status: $status, reason: $reason, scan_mode: $mode,
              tool_version: $version, exit_code: $rc, findings: $findings}' > gitleaks-status.json
          cat gitleaks-status.json

      - name: Ensure Gitleaks Report Exists
        if: always()
        env:
          SCAN_MODE: ${{ inputs.scan_mode }}
        run: |
          if [ "$SCAN_MODE" = "pr" ]; then
            [ -f gitleaks-new-findings.json ] || echo "[]" > gitleaks-new-findings.json
          else
            [ -f gitleaks-full-report.json ] || echo "[]" > gitleaks-full-report.json
          fi

      - name: Upload Gitleaks Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-results
          path: |
            gitleaks-new-findings.json
            gitleaks-full-report.json
            gitleaks-status.json
          if-no-files-found: ignore
          retention-days: 30

# ============================================================
# TRIVY
# ============================================================

  trivy:
    name: Trivy
    # Pinned for the same reason as the job above -- see that comment. Not
    # `ubuntu-latest`: the alias becomes Ubuntu 26 on 2026-10-19.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: read

    steps:

      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ======================================================
      # PR MODE — scan BASE and PR separately;
      # the security-gate job compares the results.
      # ======================================================

      - name: Create Base Worktree
        if: inputs.scan_mode == 'pr'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git worktree add --detach ../base-repository "${BASE_SHA}"

      - name: Scan Base Repository
        id: trivy_base
        if: inputs.scan_mode == 'pr'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ../base-repository
          format: json
          output: trivy-base.json
          severity: CRITICAL,HIGH
          scanners: vuln
          vuln-type: os,library
          exit-code: "0"

      - name: Scan PR Repository
        id: trivy_pr
        if: inputs.scan_mode == 'pr'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          # simulate_crash=trivy points Trivy at a path that does not exist, so the
          # real binary fails (test only; see the input's comment).
          scan-ref: ${{ inputs.simulate_crash == 'trivy' && './simulated-trivy-crash-does-not-exist' || '.' }}
          format: json
          output: trivy-pr.json
          severity: CRITICAL,HIGH
          scanners: vuln
          vuln-type: os,library
          exit-code: "0"

      - name: Full Trivy Scan
        id: trivy_full
        if: inputs.scan_mode == 'full'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.simulate_crash == 'trivy' && './simulated-trivy-crash-does-not-exist' || '.' }}
          format: json
          output: trivy-full.json
          severity: CRITICAL,HIGH
          scanners: vuln
          vuln-type: os,library
          exit-code: "0"

      # Must run BEFORE "Ensure Trivy Reports Exist", which writes empty stubs.
      # ok = every scan step for this mode succeeded and each report is a Trivy JSON
      # document (an object carrying SchemaVersion).
      - name: Record Trivy Status
        if: always()
        env:
          SCAN_MODE: ${{ inputs.scan_mode }}
          BASE_OUTCOME: ${{ steps.trivy_base.outcome }}
          PR_OUTCOME: ${{ steps.trivy_pr.outcome }}
          FULL_OUTCOME: ${{ steps.trivy_full.outcome }}
        run: |
          set -uo pipefail
          VERSION=$( (trivy --version 2>/dev/null || true) | head -n1)
          STATUS=ok; REASON=""; FINDINGS=null
          if [ "$SCAN_MODE" = "pr" ]; then
            CHECKS="base:${BASE_OUTCOME}:trivy-base.json pr:${PR_OUTCOME}:trivy-pr.json"
            COUNT_FILE=trivy-pr.json
          else
            CHECKS="full:${FULL_OUTCOME}:trivy-full.json"
            COUNT_FILE=trivy-full.json
          fi
          for c in $CHECKS; do
            IFS=: read -r name outcome report <<< "$c"
            if [ "$outcome" != "success" ]; then
              STATUS=failed; REASON="${REASON}${name} scan outcome '${outcome:-not run}'; "
            elif ! jq -e 'type == "object" and has("SchemaVersion")' "$report" >/dev/null 2>&1; then
              STATUS=failed; REASON="${REASON}${name} report missing or not Trivy JSON; "
            fi
          done
          if [ "$STATUS" = "ok" ]; then
            FINDINGS=$(jq '[.Results[]?.Vulnerabilities // []] | flatten | length' "$COUNT_FILE" 2>/dev/null || echo null)
          fi
          jq -n --arg status "$STATUS" --arg reason "$REASON" --arg mode "$SCAN_MODE" \
            --arg version "${VERSION:-unknown}" --argjson findings "$FINDINGS" \
            '{scanner: "trivy", status: $status, reason: $reason, scan_mode: $mode,
              tool_version: $version, findings: $findings}' > trivy-status.json
          cat trivy-status.json

      - name: Ensure Trivy Reports Exist
        if: always()
        run: |
          [ -f trivy-base.json ] || echo '{"Results":[]}' > trivy-base.json
          [ -f trivy-pr.json ]   || echo '{"Results":[]}' > trivy-pr.json
          [ -f trivy-full.json ] || echo '{"Results":[]}' > trivy-full.json

      - name: Upload Trivy Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-results
          path: |
            trivy-base.json
            trivy-pr.json
            trivy-full.json
            trivy-status.json
          if-no-files-found: ignore
          retention-days: 30

# ============================================================
# SEMGREP
# ============================================================

  semgrep:
    name: Semgrep
    # Pinned for the same reason as the job above -- see that comment. Not
    # `ubuntu-latest`: the alias becomes Ubuntu 26 on 2026-10-19.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: read

    steps:

      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          python -m pip install semgrep
          semgrep --version

      - name: Simulate Semgrep Crash (test only)
        if: inputs.simulate_crash == 'semgrep'
        run: |
          echo "::warning::simulate_crash=semgrep: shadowing semgrep with 'exit 2'"
          mkdir -p "$RUNNER_TEMP/simulated-crash"
          printf '#!/bin/sh\necho "simulated semgrep crash" >&2\nexit 2\n' > "$RUNNER_TEMP/simulated-crash/semgrep"
          chmod +x "$RUNNER_TEMP/simulated-crash/semgrep"
          echo "$RUNNER_TEMP/simulated-crash" >> "$GITHUB_PATH"

      - name: Run Semgrep - PR Changes
        id: semgrep_pr
        if: inputs.scan_mode == 'pr'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e

          semgrep scan \
            --config p/default \
            --baseline-commit "${BASE_SHA}" \
            --json \
            --output semgrep-new-findings.json \
            --metrics off
          rc=$?

          echo "Semgrep exit code: ${rc}"
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run Semgrep - Full Repository
        id: semgrep_full
        if: inputs.scan_mode == 'full'
        run: |
          set +e

          semgrep scan \
            --config p/default \
            --json \
            --output semgrep-full.json \
            --metrics off
          rc=$?

          echo "Semgrep exit code: ${rc}"
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"
          exit 0

      # Must run BEFORE "Ensure Semgrep Report Exists", which writes an empty stub.
      # ok = semgrep exited 0/1 (1 = findings with --error; >=2 is a semgrep error)
      # and the report is an object with a `results` array.
      - name: Record Semgrep Status
        if: always()
        env:
          SCAN_MODE: ${{ inputs.scan_mode }}
          RC: ${{ inputs.scan_mode == 'pr' && steps.semgrep_pr.outputs.rc || steps.semgrep_full.outputs.rc }}
        run: |
          set -uo pipefail
          if [ "$SCAN_MODE" = "pr" ]; then REPORT=semgrep-new-findings.json; else REPORT=semgrep-full.json; fi
          VERSION=$( (semgrep --version 2>/dev/null || true) | head -n1)
          STATUS=failed; REASON=""; FINDINGS=null
          if [ -z "$RC" ]; then
            REASON="scan step did not run"
          elif [ "$RC" != "0" ] && [ "$RC" != "1" ]; then
            REASON="semgrep exited ${RC}"
          elif [ ! -s "$REPORT" ]; then
            REASON="semgrep exited ${RC} but wrote no report"
          elif ! FINDINGS=$(jq -e 'if (.results | type) == "array" then (.results | length) else error("no results array") end' "$REPORT" 2>/dev/null); then
            FINDINGS=null; REASON="report has no results array"
          else
            STATUS=ok
          fi
          jq -n --arg status "$STATUS" --arg reason "$REASON" --arg mode "$SCAN_MODE" \
            --arg version "${VERSION:-unknown}" --arg rc "${RC:-}" --argjson findings "$FINDINGS" \
            '{scanner: "semgrep", status: $status, reason: $reason, scan_mode: $mode,
              tool_version: $version, exit_code: $rc, findings: $findings}' > semgrep-status.json
          cat semgrep-status.json

      - name: Ensure Semgrep Report Exists
        if: always()
        env:
          SCAN_MODE: ${{ inputs.scan_mode }}
        run: |
          if [ "$SCAN_MODE" = "pr" ]; then
            [ -f semgrep-new-findings.json ] || echo '{"results":[]}' > semgrep-new-findings.json
          else
            [ -f semgrep-full.json ] || echo '{"results":[]}' > semgrep-full.json
          fi

      - name: Upload Semgrep Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-results
          path: |
            semgrep-new-findings.json
            semgrep-full.json
            semgrep-status.json
          if-no-files-found: ignore
          retention-days: 30

# ============================================================
# SECURITY GATE
#
# The ONLY job that determines whether the PR security check
# passes or fails.
# ============================================================

  security-gate:
    name: Security Gate
    # Pinned for the same reason as the job above -- see that comment. Not
    # `ubuntu-latest`: the alias becomes Ubuntu 26 on 2026-10-19.
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    needs:
      - gitleaks
      - trivy
      - semgrep

    if: always()

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:

      - name: Download Gitleaks Results
        uses: actions/download-artifact@v8
        with:
          name: gitleaks-results
          path: results/gitleaks

      - name: Download Trivy Results
        uses: actions/download-artifact@v8
        with:
          name: trivy-results
          path: results/trivy

      - name: Download Semgrep Results
        uses: actions/download-artifact@v8
        with:
          name: semgrep-results
          path: results/semgrep

      - name: Analyze Security Findings
        id: findings
        env:
          SCAN_MODE: ${{ inputs.scan_mode }}
        run: |
          set -euo pipefail

          GITLEAKS_NEW=0
          TRIVY_NEW=0
          SEMGREP_NEW=0

          if [ "$SCAN_MODE" = "pr" ]; then

            GITLEAKS_FILE="results/gitleaks/gitleaks-new-findings.json"
            if [ -f "$GITLEAKS_FILE" ]; then
              GITLEAKS_NEW=$(jq 'length' "$GITLEAKS_FILE" 2>/dev/null || echo 0)
            fi

            # Trivy finding identity:
            # Target + VulnerabilityID + PkgName + InstalledVersion
            for side in base pr; do
              jq -r '
                [
                  .Results[]? |
                  . as $result |
                  ($result.Vulnerabilities // [])[] |
                  [$result.Target, .VulnerabilityID, .PkgName, .InstalledVersion] |
                  @tsv
                ] | unique | .[]
              ' "results/trivy/trivy-${side}.json" 2>/dev/null \
                | sort > "/tmp/trivy-${side}.txt" || true
            done

            comm -13 /tmp/trivy-base.txt /tmp/trivy-pr.txt > /tmp/trivy-new.txt
            TRIVY_NEW=$(wc -l < /tmp/trivy-new.txt | tr -d ' ')

            SEMGREP_FILE="results/semgrep/semgrep-new-findings.json"
            if [ -f "$SEMGREP_FILE" ]; then
              SEMGREP_NEW=$(jq '.results | length' "$SEMGREP_FILE" 2>/dev/null || echo 0)
            fi

          else

            # Full scans report the entire existing backlog.
            # They do NOT become merge gates.

            GITLEAKS_FILE="results/gitleaks/gitleaks-full-report.json"
            TRIVY_FILE="results/trivy/trivy-full.json"
            SEMGREP_FILE="results/semgrep/semgrep-full.json"

            if [ -f "$GITLEAKS_FILE" ]; then
              GITLEAKS_NEW=$(jq 'length' "$GITLEAKS_FILE" 2>/dev/null || echo 0)
            fi

            if [ -f "$TRIVY_FILE" ]; then
              TRIVY_NEW=$(jq '[.Results[]?.Vulnerabilities // []] | flatten | length' "$TRIVY_FILE" 2>/dev/null || echo 0)
            fi

            if [ -f "$SEMGREP_FILE" ]; then
              SEMGREP_NEW=$(jq '.results | length' "$SEMGREP_FILE" 2>/dev/null || echo 0)
            fi

          fi

          TOTAL_NEW=$((GITLEAKS_NEW + TRIVY_NEW + SEMGREP_NEW))

          echo "Gitleaks findings: ${GITLEAKS_NEW}"
          echo "Trivy findings: ${TRIVY_NEW}"
          echo "Semgrep findings: ${SEMGREP_NEW}"
          echo "Total findings: ${TOTAL_NEW}"

          {
            echo "gitleaks_new=${GITLEAKS_NEW}"
            echo "trivy_new=${TRIVY_NEW}"
            echo "semgrep_new=${SEMGREP_NEW}"
            echo "total_new=${TOTAL_NEW}"
          } >> "$GITHUB_OUTPUT"

      # Issue #14: a scanner is healthy only if its job succeeded AND it uploaded a
      # parsable <scanner>-status.json with status "ok". This step never fails; it
      # warns loudly in every run. "Enforce Scanner Integrity" below acts on it only
      # when fail_closed is true.
      - name: Check Scanner Integrity
        id: integrity
        env:
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          TRIVY_RESULT: ${{ needs.trivy.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
          FAIL_CLOSED: ${{ inputs.fail_closed }}
        run: |
          set -uo pipefail
          PROBLEMS=""
          for s in gitleaks trivy semgrep; do
            f="results/${s}/${s}-status.json"
            var="$(echo "$s" | tr '[:lower:]' '[:upper:]')_RESULT"
            job_result="${!var}"
            problem=""
            if [ ! -f "$f" ]; then
              problem="no status file (job result: ${job_result})"
            elif ! status=$(jq -er '.status | strings' "$f" 2>/dev/null); then
              problem="status file unparsable (job result: ${job_result})"
            elif [ "$status" != "ok" ]; then
              problem="status '${status}': $(jq -r '.reason // ""' "$f") (job result: ${job_result})"
            elif [ "$job_result" != "success" ]; then
              problem="job result '${job_result}'"
            fi
            if [ -n "$problem" ]; then
              echo "::warning title=Scanner ${s} did not run cleanly::${s}: ${problem}. Its findings count is NOT trustworthy."
              PROBLEMS="${PROBLEMS}${s}: ${problem}; "
            else
              echo "${s}: ok ($(jq -c '{tool_version, findings}' "$f"))"
            fi
          done
          if [ -n "$PROBLEMS" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            if [ "$FAIL_CLOSED" != "true" ]; then
              echo "::warning title=Security Gate is failing OPEN::fail_closed is false, so this gate still passes although a scanner did not run cleanly: ${PROBLEMS}"
            fi
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
          echo "problems=${PROBLEMS}" >> "$GITHUB_OUTPUT"

      - name: Write Security Summary
        env:
          GITLEAKS_NEW: ${{ steps.findings.outputs.gitleaks_new }}
          TRIVY_NEW: ${{ steps.findings.outputs.trivy_new }}
          SEMGREP_NEW: ${{ steps.findings.outputs.semgrep_new }}
          TOTAL_NEW: ${{ steps.findings.outputs.total_new }}
          SCAN_MODE: ${{ inputs.scan_mode }}
          INTEGRITY_OK: ${{ steps.integrity.outputs.ok }}
          INTEGRITY_PROBLEMS: ${{ steps.integrity.outputs.problems }}
          FAIL_CLOSED: ${{ inputs.fail_closed }}
        run: |
          {
            echo "# 🛡️ Security Scan Results"
            echo ""

            if [ "$SCAN_MODE" = "pr" ]; then
              echo "## New Findings Introduced by This PR"
            else
              echo "## Full Repository Scan"
            fi

            echo ""
            echo "| Scanner | Findings |"
            echo "|---|---:|"
            echo "| Gitleaks | ${GITLEAKS_NEW} |"
            echo "| Trivy | ${TRIVY_NEW} |"
            echo "| Semgrep | ${SEMGREP_NEW} |"
            echo "| **Total** | **${TOTAL_NEW}** |"
            echo ""

            if [ "$INTEGRITY_OK" != "true" ]; then
              echo "### ⚠️ Scanner integrity: NOT all scanners ran cleanly"
              echo ""
              echo "${INTEGRITY_PROBLEMS}"
              echo ""
              if [ "$FAIL_CLOSED" = "true" ]; then
                echo "\`fail_closed: true\` — the gate fails."
              else
                echo "\`fail_closed: false\` — the gate is failing open; the counts above are not trustworthy."
              fi
              echo ""
            fi

            if [ "$SCAN_MODE" = "pr" ]; then
              if [ "$TOTAL_NEW" -eq 0 ]; then
                echo "### ✅ No New Security Findings"
                echo ""
                echo "Existing findings are not treated as new findings."
              else
                echo "### ⚠️ New Security Findings Detected"
                echo ""
                echo "This PR introduced ${TOTAL_NEW} new security finding(s)."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on Pull Request
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          GITLEAKS_NEW: ${{ steps.findings.outputs.gitleaks_new }}
          TRIVY_NEW: ${{ steps.findings.outputs.trivy_new }}
          SEMGREP_NEW: ${{ steps.findings.outputs.semgrep_new }}
          TOTAL_NEW: ${{ steps.findings.outputs.total_new }}
          ENFORCE: ${{ inputs.enforce_new_findings }}
          INTEGRITY_OK: ${{ steps.integrity.outputs.ok }}
          INTEGRITY_PROBLEMS: ${{ steps.integrity.outputs.problems }}
          FAIL_CLOSED: ${{ inputs.fail_closed }}
        with:
          script: |
            const prNumber = context.payload.pull_request?.number;
            if (!prNumber) {
              return;
            }

            const gitleaks = Number(process.env.GITLEAKS_NEW || 0);
            const trivy = Number(process.env.TRIVY_NEW || 0);
            const semgrep = Number(process.env.SEMGREP_NEW || 0);
            const total = Number(process.env.TOTAL_NEW || 0);
            const enforce = process.env.ENFORCE === "true";

            let body = `## 🛡️ Security Scan Results\n\n`;
            body += `This scan evaluates **new findings introduced by this pull request**.\n\n`;
            body += `| Scanner | New Findings |\n`;
            body += `|---|---:|\n`;
            body += `| 🔑 Gitleaks | ${gitleaks} |\n`;
            body += `| 📦 Trivy | ${trivy} |\n`;
            body += `| 🔍 Semgrep | ${semgrep} |\n`;
            body += `| **Total** | **${total}** |\n\n`;

            if (total === 0) {
              body += `### ✅ No New Security Findings\n\n`;
              body += `No new Gitleaks, Trivy, or Semgrep findings were detected.\n\n`;
              body += enforce ? `**Security gate: PASSED**` : `**Security gate: WARN-ONLY**`;
            } else {
              body += `### ⚠️ New Security Findings Detected\n\n`;
              body += `This pull request introduces **${total} new security finding(s)**.\n\n`;
              if (enforce) {
                body += `### ❌ Security Gate: FAILED\n\n`;
                body += `New security findings must be resolved before this pull request can be merged.`;
              } else {
                body += `### ⚠️ Security Gate: WARN-ONLY\n\n`;
                body += `New findings were detected, but this workflow is currently configured not to block merges.`;
              }
            }

            if (process.env.INTEGRITY_OK !== "true") {
              body += `\n\n### ⚠️ Scanner integrity: not all scanners ran cleanly\n\n`;
              body += `${process.env.INTEGRITY_PROBLEMS || "unknown"}\n\n`;
              body += process.env.FAIL_CLOSED === "true"
                ? `**fail_closed is on: Security Gate FAILED.**`
                : `**fail_closed is off: the gate is failing open; the counts above are not trustworthy.**`;
            }

            body += `\n\n🤖 *Security scan results are available in the GitHub Actions run.*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body
            });

      - name: Enforce Scanner Integrity
        if: inputs.fail_closed == true
        env:
          INTEGRITY_OK: ${{ steps.integrity.outputs.ok }}
          INTEGRITY_PROBLEMS: ${{ steps.integrity.outputs.problems }}
        run: |
          if [ "$INTEGRITY_OK" != "true" ]; then
            echo "::error::Security gate failed (fail_closed): not all scanners ran cleanly: ${INTEGRITY_PROBLEMS}"
            exit 1
          fi
          echo "All three scanners ran cleanly."

      - name: Enforce Security Gate
        if: inputs.scan_mode == 'pr' && inputs.enforce_new_findings == true
        env:
          TOTAL_NEW: ${{ steps.findings.outputs.total_new }}
        run: |
          if [ "$TOTAL_NEW" -gt 0 ]; then
            echo "::error::Security gate failed: ${TOTAL_NEW} new security finding(s) were introduced."
            exit 1
          fi

          echo "Security gate passed."
          echo "No new security findings detected."

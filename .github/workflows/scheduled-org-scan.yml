name: Org Security Scan

run-name: "🛡️ ${{ inputs.org || 'BacMR' }} security scan — ${{ github.event_name == 'schedule' && 'scheduled' || format('by @{0}', github.actor) }}"

on:
  workflow_dispatch:
    inputs:
      org:
        description: "GitHub org to scan (any org the runner's gh account can access)"
        required: false
        default: "BacMR"
      test_repos:
        description: "Comma-separated repos to scan (owner/repo). Leave blank for all repos."
        required: false
        default: ""

  schedule:
    - cron: "0 5 * * *"

# Least privilege: no job uses GITHUB_TOKEN. Every gh/git call authenticates
# with the self-hosted runner's own gh login (`gh auth token`), there is no
# checkout, SARIF upload, dispatch or issue write, and results go to the
# secscan Postgres DB. So the workflow token gets no scopes at all.
permissions: {}

concurrency:
  group: org-security-scan-${{ inputs.org || 'BacMR' }}
  cancel-in-progress: false

env:
  ORG: ${{ inputs.org || 'BacMR' }}
  SECSCAN_HOME: /opt/security-scanner

# ============================================================
# 1. DISCOVER REPOS + OPEN SCAN RUN IN DB
# ============================================================

jobs:

  discover:
    name: Discover Repositories
    runs-on: [self-hosted, secscan]
    timeout-minutes: 10

    outputs:
      repo_matrix: ${{ steps.matrix.outputs.repos }}
      scan_run_id: ${{ steps.open-run.outputs.scan_run_id }}

    steps:

      - name: Get Repo List (Org Scope)
        env:
          TEST_REPOS: ${{ inputs.test_repos }}
        run: |
          set -euo pipefail
          export GH_TOKEN="$(gh auth token)"

          if [ -n "$TEST_REPOS" ]; then
            echo "Using test repository list"
            echo "$TEST_REPOS" | tr ',' '\n' | sed 's/^ *//; s/ *$//' | sed '/^$/d' > repos.txt
          else
            echo "Scanning all non-archived repositories in $ORG"
            gh repo list "$ORG" \
              --no-archived \
              --limit 1000 \
              --json nameWithOwner \
              --jq '.[].nameWithOwner' \
              > repos.txt
          fi

          echo "Repositories selected for scanning:"
          wc -l < repos.txt
          cat repos.txt

      - name: Build Matrix
        id: matrix
        run: |
          set -euo pipefail
          jq -R -s 'split("\n") | map(select(length > 0))' repos.txt > repos.json
          echo "repos=$(jq -c . repos.json)" >> "$GITHUB_OUTPUT"

      - name: Open Scan Run in Database
        id: open-run
        run: |
          set -euo pipefail
          set -a; source "$SECSCAN_HOME/etc/db.env"; set +a

          # psql only interpolates :'var' on stdin/-f input, not with -c
          SCAN_RUN_ID=$("$SECSCAN_HOME/bin/psql" -qtA -v ON_ERROR_STOP=1 -v org="$ORG" <<'SQL'
          INSERT INTO scan_runs (github_run_id, run_type, org)
          VALUES (${{ github.run_id }}, 'org', :'org')
          RETURNING id;
          SQL
          )

          echo "Opened scan run ${SCAN_RUN_ID}"
          echo "scan_run_id=${SCAN_RUN_ID}" >> "$GITHUB_OUTPUT"

# ============================================================
# 2. SCAN REPOSITORIES
#
# Tools are pre-installed under /opt/security-scanner.
# Repo clones are cached between runs; each scanner's JSON
# report is written straight to the secscan Postgres database.
# ============================================================

  scan:
    name: Scan
    needs: discover
    runs-on: [self-hosted, secscan]
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        repository: ${{ fromJson(needs.discover.outputs.repo_matrix) }}

    env:
      SCAN_RUN_ID: ${{ needs.discover.outputs.scan_run_id }}
      REPO: ${{ matrix.repository }}

    steps:

      - name: Add Scanner Tools to PATH
        run: echo "$SECSCAN_HOME/bin" >> "$GITHUB_PATH"

      - name: Sync Repository (Cached Clone)
        id: sync
        run: |
          set -euo pipefail
          export GH_TOKEN="$(gh auth token)"

          CACHE="$SECSCAN_HOME/cache/repos/$REPO"

          # Authenticate via gh's credential helper so no token is
          # ever written into the cached clone's git config.
          GIT_AUTH=(-c credential.helper= -c "credential.helper=!gh auth git-credential")

          if [ -d "$CACHE/.git" ]; then
            echo "Updating cached clone"
            git "${GIT_AUTH[@]}" -C "$CACHE" fetch origin --prune --tags --force
          else
            echo "Cloning fresh (full history)"
            mkdir -p "$(dirname "$CACHE")"
            git "${GIT_AUTH[@]}" clone "https://github.com/$REPO.git" "$CACHE"
          fi

          # Empty repos (no commits) have no remote HEAD — skip scanning.
          if git "${GIT_AUTH[@]}" -C "$CACHE" remote set-head origin --auto 2>/dev/null \
             && DEFAULT=$(git -C "$CACHE" symbolic-ref --short refs/remotes/origin/HEAD 2>/dev/null | sed 's|^origin/||') \
             && [ -n "$DEFAULT" ]; then
            git -C "$CACHE" checkout -f "$DEFAULT"
            git -C "$CACHE" reset --hard "origin/$DEFAULT"
            echo "has_code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Repository is empty — recording zero findings"
            echo "has_code=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Gitleaks (Full History)
        if: steps.sync.outputs.has_code == 'true'
        run: |
          set -euo pipefail
          gitleaks git "$SECSCAN_HOME/cache/repos/$REPO" \
            --redact \
            --report-format json \
            --report-path "$RUNNER_TEMP/gitleaks.json" \
            --exit-code 0

      - name: Run Trivy
        if: steps.sync.outputs.has_code == 'true'
        env:
          TRIVY_CACHE_DIR: /opt/security-scanner/cache/trivy
        run: |
          set -euo pipefail
          # --offline-scan: never hit remote registries (Maven Central
          # rate-limits scanners with 429s); the vuln DB is cached locally.
          trivy fs \
            --offline-scan \
            --scanners vuln \
            --pkg-types os,library \
            --severity CRITICAL,HIGH \
            --format json \
            --output "$RUNNER_TEMP/trivy.json" \
            --exit-code 0 \
            "$SECSCAN_HOME/cache/repos/$REPO"

      - name: Run Semgrep
        if: steps.sync.outputs.has_code == 'true'
        run: |
          set +e
          semgrep scan \
            --config p/default \
            --json \
            --output "$RUNNER_TEMP/semgrep.json" \
            --metrics off \
            "$SECSCAN_HOME/cache/repos/$REPO"
          echo "Semgrep exit code: $?"
          exit 0

      - name: Write Reports to Database
        if: always()
        run: |
          set -euo pipefail
          # Empty/skipped scans get empty reports so every repo shows up
          # in the summary with an explicit zero.
          [ -f "$RUNNER_TEMP/gitleaks.json" ] || echo '[]'             > "$RUNNER_TEMP/gitleaks.json"
          [ -f "$RUNNER_TEMP/trivy.json" ]    || echo '{"Results":[]}' > "$RUNNER_TEMP/trivy.json"
          [ -f "$RUNNER_TEMP/semgrep.json" ]  || echo '{"results":[]}' > "$RUNNER_TEMP/semgrep.json"
          secscan-ingest "$SCAN_RUN_ID" "$REPO" gitleaks "$RUNNER_TEMP/gitleaks.json"
          secscan-ingest "$SCAN_RUN_ID" "$REPO" trivy    "$RUNNER_TEMP/trivy.json"
          secscan-ingest "$SCAN_RUN_ID" "$REPO" semgrep  "$RUNNER_TEMP/semgrep.json"

# ============================================================
# 3. AGGREGATE
#
# Close the scan run and summarize results from the database.
# ============================================================

  aggregate:
    name: Aggregate Results
    needs: [discover, scan]
    if: always() && needs.discover.result == 'success'
    runs-on: [self-hosted, secscan]
    timeout-minutes: 10

    env:
      SCAN_RUN_ID: ${{ needs.discover.outputs.scan_run_id }}

    steps:

      - name: Close Scan Run
        run: |
          set -euo pipefail
          set -a; source "$SECSCAN_HOME/etc/db.env"; set +a

          "$SECSCAN_HOME/bin/psql" -q -v ON_ERROR_STOP=1 \
            -c "UPDATE scan_runs SET finished_at = now() WHERE id = ${SCAN_RUN_ID}"

      - name: Write Security Summary
        env:
          REPO_MATRIX: ${{ needs.discover.outputs.repo_matrix }}
        run: |
          set -euo pipefail
          set -a; source "$SECSCAN_HOME/etc/db.env"; set +a
          PSQL="$SECSCAN_HOME/bin/psql"

          {
            echo "# 🛡️ ${ORG} Security Scan — Run ${SCAN_RUN_ID}"
            echo ""
            echo "## Findings by Repository"
            echo ""
            echo "Every repository in the scan is listed — including clean ones."
            echo "\`⚠ no data\` means the scan job produced no report for that repo."
            echo ""
            echo "| Repository | Gitleaks | Trivy | Semgrep | Total |"
            echo "|---|---:|---:|---:|---:|"
            QUERY_FILE=$(mktemp)
            cat > "$QUERY_FILE" <<SQL
              WITH per_repo AS (
                SELECT repository,
                       coalesce(sum(findings_count) FILTER (WHERE scanner = 'gitleaks'), 0) AS gitleaks,
                       coalesce(sum(findings_count) FILTER (WHERE scanner = 'trivy'),    0) AS trivy,
                       coalesce(sum(findings_count) FILTER (WHERE scanner = 'semgrep'),  0) AS semgrep,
                       coalesce(sum(findings_count), 0) AS total
                FROM repo_scans
                WHERE scan_run_id = ${SCAN_RUN_ID}
                GROUP BY repository
              )
              SELECT m.repo,
                     coalesce(p.gitleaks::text, '–'),
                     coalesce(p.trivy::text,    '–'),
                     coalesce(p.semgrep::text,  '–'),
                     CASE WHEN p.repository IS NULL THEN '⚠ no data'
                          ELSE p.total::text END
              FROM jsonb_array_elements_text(:'matrix'::jsonb) AS m(repo)
              LEFT JOIN per_repo p ON p.repository = m.repo
              ORDER BY coalesce(p.total, -1) DESC, m.repo;
          SQL
            "$PSQL" -qtA -F'|' -v matrix="$REPO_MATRIX" -f "$QUERY_FILE" \
              | awk -F'|' '{printf "| %s | %s | %s | %s | %s |\n", $1, $2, $3, $4, $5}'
            rm -f "$QUERY_FILE"
            echo ""
            TOTAL=$("$PSQL" -qtA -c "
              SELECT coalesce(sum(findings_count), 0)
              FROM repo_scans WHERE scan_run_id = ${SCAN_RUN_ID}")
            SCANNED=$("$PSQL" -qtA -c "
              SELECT count(DISTINCT repository)
              FROM repo_scans WHERE scan_run_id = ${SCAN_RUN_ID}")
            EXPECTED=$(jq -r 'length' <<< "$REPO_MATRIX")
            echo "**Repositories: ${SCANNED}/${EXPECTED} scanned — Total findings: ${TOTAL}**"
            echo ""
            echo "Full reports are stored in the \`secscan\` database (\`repo_scans\`, \`findings\`)."
          } >> "$GITHUB_STEP_SUMMARY"

version: 2

# github-security-workflows is the provider of the reusable security-scan workflow
# that all ten BacMR repos call. It ships only workflow YAML and shell -- there is
# no package manifest of any kind -- so "github-actions" is the complete and
# correct ecosystem list, exactly as before.
#
# This config keeps that single ecosystem and only adds the org-standard noise
# controls that were missing: grouped minor/patch updates, an explicit PR limit,
# and a 7-day cooldown. Nothing here is loosened.
#
# The cooldown is deliberately kept even though this is the security provider: it
# is a supply-chain quarantine on third-party actions (a compromised action
# release is a far likelier failure mode than a 7-day-stale one), and the actual
# scanner versions are pinned in the workflow itself (e.g. GITLEAKS_VERSION),
# not resolved by Dependabot.
#
# NOTE: this repo's default branch is "main", not "dev" like the other nine, so
# there is no target-branch override -- Dependabot targets the default branch.
# That difference is intentional: every repo's pr-security.yml pins
# "...security-scan.yml@main", so renaming or retargeting this branch would break
# the security gate across the whole org.
#
# Staggered schedule: Tuesday 09:00, offset from web-platform's Tuesday 06:00 slot.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
    # Monthly, not weekly. At ~29 billed Actions minutes per dependency PR and 19
    # ecosystem entries across the org, a weekly cadence with the patch/minor
    # split projected to roughly 4,500 min/month against a 3,000-minute
    # allowance. With spending caps at $0 an exhausted allowance does not
    # produce a bill, it stops Actions — and a required status check that cannot
    # run never reports, which blocks every PR in the org. CI cost is therefore
    # a correctness constraint here, not a budget nicety.
    #
    # This does NOT delay security fixes: `schedule.interval` governs version
    # updates only. Dependabot security updates are advisory-driven and fire
    # independently of this schedule, and grouped `applies-to` defaults to
    # version-updates, so a CVE fix still arrives as its own PR immediately.
    #
    # Tradeoff accepted: the old weekday stagger (one repo per day) is gone,
    # because `schedule.day` applies to weekly only — every entry now runs on the
    # 1st, spaced just by `time`. If that day-1 spike becomes a problem, the fix
    # is `interval: "cron"` with a `cronjob:` expression, which can spread
    # entries across days of the month and keep the 4x saving.
      interval: "monthly"
      time: "09:00"
      timezone: "Africa/Nouakchott"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      # Grouped by update-type on purpose. dependabot/fetch-metadata reports the
      # HIGHEST semver change across a whole PR, so one major anywhere inside a
      # mixed group makes the entire PR unclassifiable and the Tier 1 auto-merge
      # workflow refuses it. Splitting patch from minor keeps every grouped PR
      # cleanly one update-type, and leaves majors as individual PRs for review.
      # This is load-bearing for auto-merge, not cosmetic.
      #
      # `update-types` here takes the SHORT forms (patch/minor/major). The
      # `version-update:semver-*` spelling belongs to `ignore`/`allow` only --
      # using it in a group is an invalid config.
      patch:
        update-types:
          - "patch"
      minor:
        update-types:
          - "minor"

# Copy this file into any BacMR repo as
# .github/workflows/pr-security.yml to get PR-time security gating.

name: PR Security

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  security:
    uses: BacMR/github-security-workflows/.github/workflows/security-scan.yml@main
    with:
      scan_mode: pr
      enforce_new_findings: true
